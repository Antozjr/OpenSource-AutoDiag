; ============================================================================
;  PlatformIO · OpenSource AutoDiag
;  ----------------------------------------------------------------------------
;  Este repo cubre la plataforma general (motor, ABS/SRS/BCM...),
;  configurada ahora mismo para un Honda Civic 2.2 i-CTDi (N22A). El
;  diagnóstico específico del turbo VGT de ese coche se desarrolló aparte.
;
;  Estructura del proyecto:
;    firmware/sniffer/sniffer.cpp   <- Fase 1, listen-only puro
;    firmware/autodiag/autodiag.cpp <- Fases 2-3, firmware genérico
;    web/                           <- interfaces web (Web Serial), una por firmware
;
;  src_dir apunta a firmware/, y cada entorno filtra su propia subcarpeta con
;  build_src_filter — no hay copia previa ni límite de un solo archivo activo:
;    pio run -e sniffer -t upload
;    pio run -e autodiag -t upload
; ============================================================================

[platformio]
default_envs = autodiag
src_dir = firmware

[env]
platform  = espressif32
board     = esp32dev          ; cambia si usas otra placa (p.ej. esp32-c3-devkitm-1)
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

; ---- Entorno Sniffer (MCP2515 en modo listen-only, solo lectura pasiva) ----
; Herramienta mínima de reconocimiento, sin capacidad de transmitir nada.
; Útil como primer contacto seguro con un coche nuevo. Firmware en
; firmware/sniffer/sniffer.cpp. Para todo lo demás (Fases 2-3), usa autodiag.
[env:sniffer]
build_src_filter = -<*> +<sniffer/>
build_flags = -D FW_SNIFFER
lib_deps =
    coryjfowler/mcp_can @ ^1.5.1

; ---- Entorno AutoDiag (firmware principal, genérico por coche) ----
; Arranca en listen-only igual que sniffer; MODE:ACTIVE habilita, bajo
; petición explícita, peticiones UDS/OBD2 de solo lectura (+ borrado de
; DTC) para cualquier coche configurado en el garaje de web/app.html.
; Firmware en firmware/autodiag/autodiag.cpp.
[env:autodiag]
build_src_filter = -<*> +<autodiag/>
build_flags = -D FW_AUTODIAG
lib_deps =
    coryjfowler/mcp_can @ ^1.5.1
